# Z tego pliku GitHub generuje ios/Planowanie.xcodeproj (workflow „iPhone – projekt Xcode”).
# Do pracy wystarczy otworzyć gotowy Planowanie.xcodeproj.
name: Planowanie
options:
  bundleIdPrefix: com.julkapajak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Planowanie:
    type: application
    platform: iOS
    sources:
      # folder synchronizowany: nowe pliki w ios/Planowanie same trafiają do projektu
      - path: Planowanie
        type: syncedFolder
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Planowanie
        CFBundleDevelopmentRegion: pl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.productivity
        NSFaceIDUsageDescription: Face ID chroni Twój plan przed innymi osobami.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julkapajak.planowanie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # na razie tylko iPhone; Mac dojdzie w kolejnym kroku (Planowanie.entitlements jest na to gotowy)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Planowanie:
    build:
      targets:
        Planowanie: all
    run:
      config: Debug
    archive:
      config: Release
