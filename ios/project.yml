name: Planowanie
options:
  bundleIdPrefix: com.julkapajak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: pl
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Planowanie:
    type: application
    platform: iOS
    sources: [Planowanie]
    info:
      path: Planowanie/Info.plist
      properties:
        CFBundleDisplayName: Planowanie
        CFBundleDevelopmentRegion: pl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        LSApplicationCategoryType: public.app-category.productivity
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.julkapajak.planowanie
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iPhone + iPad + Mac (Mac Catalyst) – jedna aplikacja w App Store na wszystkie urządzenia
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Planowanie/Planowanie.entitlements
        CODE_SIGN_STYLE: Automatic
schemes:
  Planowanie:
    build:
      targets:
        Planowanie: all
    run:
      config: Debug
    archive:
      config: Release
