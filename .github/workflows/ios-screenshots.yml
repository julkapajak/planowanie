name: iPhone – zrzuty ekranu

# Uruchamiane ręcznie: buduje aplikację, odpala ją na symulatorze iPhone'a
# i zapisuje zrzuty ekranu w ios/screenshots/.
on:
  workflow_dispatch:
    inputs:
      device:
        description: Model symulatora
        default: iPhone 16 Pro Max

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    env:
      DEVICE: ${{ inputs.device || 'iPhone 16 Pro Max' }}
    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj
        run: |
          cd ios
          xcodebuild -project Planowanie.xcodeproj -scheme Planowanie \
            -destination "generic/platform=iOS Simulator" -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 20
          exit ${PIPESTATUS[0]}

      - name: Zrób zrzuty ekranu
        run: |
          runtime() {
            xcrun simctl list runtimes iOS -j | python3 -c "import sys,json; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('isAvailable')]; print(r[-1]['identifier'] if r else '')"
          }
          RUNTIME=$(runtime)
          if [ -z "$RUNTIME" ]; then
            echo "Brak systemu iOS dla symulatora – pobieram"
            xcodebuild -downloadPlatform iOS
            RUNTIME=$(runtime)
          fi
          UDID=$(xcrun simctl create "$DEVICE" "com.apple.CoreSimulator.SimDeviceType.${DEVICE// /-}" "$RUNTIME")
          echo "Symulator: $DEVICE ($UDID), system: $RUNTIME"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4
          xcrun simctl install "$UDID" ios/build/Build/Products/Debug-iphonesimulator/Planowanie.app

          OUT=ios/screenshots
          rm -rf "$OUT" && mkdir -p "$OUT"
          shot() {
            local name=$1; shift
            xcrun simctl launch --terminate-running-process "$UDID" com.julkapajak.planowanie "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "$OUT/$name.png"
          }
          shot 1-powitanie
          shot 2-dzien -demoProfile Julia
          shot 3-tydzien -startTab 1
          shot 4-ustawienia -startTab 2
          xcrun simctl ui "$UDID" appearance dark
          shot 5-dzien-ciemny
          sips -Z 1000 "$OUT"/*.png >/dev/null
          ls -la "$OUT"

      - name: Zapisz zrzuty w repo
        run: |
          git add ios/screenshots
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit -m "Zrzuty ekranu: $DEVICE"
          git pull --rebase -q
          git push
