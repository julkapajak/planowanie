name: Publikacja na GitHub Pages

on:
  push:
    branches: [main, claude/focused-hamilton-ocf757]
    paths-ignore: ["ios/**", "desktop/**", "supabase/**", ".github/workflows/ios.yml", ".github/workflows/ios-screenshots.yml", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Przygotuj pliki
        run: |
          mkdir _site
          cp index.html site.css privacy.html icon.svg icon-*.png _site/
          cp -r app _site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
