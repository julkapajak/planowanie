name: iOS – kompilacja

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Wygeneruj projekt Xcode
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Zbuduj na symulator
        run: |
          cd ios
          xcodebuild -project Planowanie.xcodeproj -scheme Planowanie \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          exit ${PIPESTATUS[0]}
